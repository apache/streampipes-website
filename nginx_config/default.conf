server {
  listen       8081 default_server;
  try_files $uri $uri/index.html $uri/ =404;

  root /usr/share/nginx/html;

  # Emit relative Location headers so redirects work behind the reverse proxy.
  absolute_redirect off;

  # Docs versions that are no longer built: send old deep links to the
  # current docs. Renamed page ids are then handled by the client-side
  # redirects generated from website-v2/src/redirects.js.
  location ~ ^/docs/(next|0\.95\.0|0\.93\.0|0\.92\.0|0\.91\.0|0\.90\.0|0\.70\.0|0\.69\.0|0\.68\.0)/(.*)$ {
    return 301 /docs/$2;
  }

  # Python docs versions that were removed.
  location ~ ^/docs/docs/python/(0\.91\.0|0\.92\.0|0\.93\.0|0\.95\.0)/(.*)$ {
    return 301 /docs/docs/python/latest/$2;
  }

  # Legacy URLs of the old website (see .htaccess for the production rules).
  location = /getinvolved.html { return 301 /community/get-involved/; }
  location = /mailinglists.html { return 301 /community/mailing-lists/; }
  location = /docs/docs/deploy-docker.html { return 301 /docs/configure-operate-deployment/; }
  location = /docs/docs/extend-cli.html { return 301 /docs/extend-cli/; }
  location = /docs/docs/extend-sdk-functions.html { return 301 /docs/extend-sdk-functions/; }
}
